<!doctype html><html lang="en"><meta charset="utf-8"><title>OpenCluely browser agent</title>
<style>body{width:330px;font:14px/1.5 system-ui;background:#171c27;color:#eee;padding:12px}button{padding:8px;margin:4px}code{overflow-wrap:anywhere}#status{white-space:pre-wrap}small{color:#bdc7d8}</style>
<h2>OpenCluely</h2><p>Allow the current tab for a task started in the desktop app.</p>
<p>Extension ID:<br><code id="id"></code></p>
<button id="connect">Connect and allow this tab</button><button id="stop">Stop &amp; disconnect</button>
<p id="status" role="status"></p><small>OpenCluely must be running. Register this ID in its Desktop agent panel first. Enable Auto approve in the desktop app to perform task actions without prompts. Stop shortcut: Ctrl+Shift+Y.</small>
<script src="popup.js"></script></html>
